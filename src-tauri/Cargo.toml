[package]
name = "urban-radio-station"
version = "0.1.0"
description = "Urban Radio Windows station runtime"
authors = ["Urban Radio"]
edition = "2021"

[lib]
name = "urban_radio_station"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.6.2"

[dependencies]
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
log = "0.4"
tauri = "2.11.2"
tauri-plugin-log = "2.8.0"
tauri-plugin-single-instance = "2.4.2"
symphonia = { version = "0.6.0", features = ["aac", "flac", "mp3", "wav"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

[target.'cfg(target_os = "windows")'.dependencies]
cpal = { version = "0.17.3", features = ["asio"] }

[dev-dependencies]
tempfile = "3.27.0"
